name: Agent eval

on:
  pull_request:

permissions:
  contents: read

jobs:
  eval:
    name: Quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: 06-lab-complete/benchmark-observability/develop
    steps:
      - uses: actions/checkout@v4
      - name: Read approved baseline from the target commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: approved-baseline
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - name: Evaluate v2
        env:
          AGENT_VERSION: v2
          MOCK_ERROR_RATE: '0'
          PORT: '8002'
        run: |
          python app.py > "$RUNNER_TEMP/day14-agent.log" 2>&1 &
          agent_pid=$!
          trap 'kill "$agent_pid" 2>/dev/null || true' EXIT
          if ! curl --retry 20 --retry-connrefused --retry-delay 1 -fsS http://localhost:8002/health; then
            cat "$RUNNER_TEMP/day14-agent.log"
            exit 1
          fi
          baseline="$GITHUB_WORKSPACE/approved-baseline/reports/eval_v2_fixed.json"
          if [[ ! -f "$baseline" ]]; then
            # The initial PR introduces the eval and its reference report.
            baseline="$GITHUB_WORKSPACE/reports/eval_v2.json"
          fi
          python eval/run_eval.py --url http://localhost:8002 --min-accuracy 0.85 --baseline "$baseline"
